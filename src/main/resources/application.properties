# Application identity and server port.
spring.application.name=trase
server.port=${PORT:8080}
# Default profile when none is specified.
spring.profiles.default=dev

# Primary datasource connection settings (dev/local defaults).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trase}
spring.datasource.username=${DB_USER:trase}
spring.datasource.password=${DB_PASSWORD:trase}

# JPA/Hibernate tuning and lifecycle behavior.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true

# Liquibase migration configuration.
spring.liquibase.change-log=classpath:rdbms/changelog.yml
spring.liquibase.enabled=true

# JWT signing/verification configuration and housekeeping.
security.jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}
security.jwt.private-key=${JWT_PRIVATE_KEY:classpath:keys/dev-private.pem}
security.jwt.issuer=${JWT_ISSUER:trase}
security.jwt.token-ttl=1h
security.jwt.revocation-cleanup-cron=0 0 * * * *

# Resilience4j rate limiter settings for API endpoints.
resilience4j.ratelimiter.instances.api.limit-for-period=120
resilience4j.ratelimiter.instances.api.limit-refresh-period=1m
resilience4j.ratelimiter.instances.api.timeout-duration=0

# Actuator exposure and health probe settings.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Include actuator endpoints in generated OpenAPI docs.
springdoc.show-actuator=true
