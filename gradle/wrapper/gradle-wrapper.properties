# Base directory for storing the Gradle distribution.
distributionBase=GRADLE_USER_HOME
# Path under distributionBase to keep wrapper distributions.
distributionPath=wrapper/dists
# Gradle distribution to download and use.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.0-bin.zip
# Network timeout (ms) for downloading the distribution.
networkTimeout=10000
# Enforce URL validation checks when downloading the distribution.
validateDistributionUrl=true
# Base directory for storing the distribution zip.
zipStoreBase=GRADLE_USER_HOME
# Path under zipStoreBase to keep wrapper zips.
zipStorePath=wrapper/dists
